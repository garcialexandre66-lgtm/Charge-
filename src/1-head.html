<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EEF1EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121722" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Charge">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Charge</title>
<link rel="stylesheet" crossorigin href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
<style>
/* Charge 5 — "carnet de fonte": a training logbook page. Cool graph paper, blue-black ink,
   a yellow highlighter on what you must lift now, red pen for records and failures, green for done sets.
   One type family (Archivo) used across its width axis: wide and heavy for titles, narrow for numbers, normal for text.
   Layout: one column ≤ 480 px; the session is a ruled table (one line per set, one tap to validate). */
:root{
 --paper:#EEF1EC;--paper2:#E3E8E1;--card:#F8FAF6;--grid:rgba(24,35,58,.055);
 --ink:#18233A;--ink2:#465169;--ink3:#5F687B;--rule:#CBD2C8;--rule2:#B3BCB1;
 --hl:#FFE04A;--hl2:rgba(255,224,74,.45);--red:#BF2F2C;--ok:#1E7A4A;--okbg:rgba(30,122,74,.12);--warn:#9A5B00;--warnbg:rgba(178,106,0,.12);
 --btn:#18233A;--onbtn:#FFFFFF;--shade:rgba(24,35,58,.38);--sh:0 1px 0 rgba(24,35,58,.06),0 8px 24px rgba(24,35,58,.10);
 --fw:'Archivo',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
 color-scheme:light}
@media (prefers-color-scheme:dark){:root{
 --paper:#121722;--paper2:#1A2130;--card:#1E2635;--grid:rgba(233,237,243,.04);
 --ink:#E9EDF3;--ink2:#B2BBCB;--ink3:#97A1B3;--rule:#2C3546;--rule2:#3B4659;
 --hl:#FFD83D;--hl2:rgba(255,216,61,.28);--red:#FF7468;--ok:#4CC38A;--okbg:rgba(76,195,138,.14);--warn:#F2B13D;--warnbg:rgba(242,177,61,.14);
 --btn:#FFD83D;--onbtn:#121722;--shade:rgba(0,0,0,.6);--sh:0 8px 24px rgba(0,0,0,.4);color-scheme:dark}}
html,body{height:100%}
body{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;
 color:var(--ink);font:400 16px/1.45 var(--fw);font-stretch:100%;margin:0;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:6px}
[tabindex="-1"]:focus,[tabindex="-1"]:focus-visible{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{max-width:480px;margin:0 auto;min-height:100%;padding:20px 18px 132px;display:flex;flex-direction:column;gap:22px}
/* type scale: 13 · 15 · 16 · 20 · 26 · 40 */
h1{margin:0;font:900 40px/1 var(--fw);font-stretch:118%;letter-spacing:-.5px;text-wrap:balance}
h1.md{font-size:30px}
h2{margin:0;font:800 20px/1.15 var(--fw);font-stretch:110%}
.lbl{font-size:15px;font-weight:700;color:var(--ink);margin:0}
.mut{color:var(--ink2)}.dim{color:var(--ink3)}.sm{font-size:15px}.xs{font-size:13px;line-height:1.4}.ac{color:var(--ink);font-weight:700}.okc{color:var(--ok)}.warnc{color:var(--warn)}.redc{color:var(--red)}
.b{font-weight:700}
.num{font-weight:800;font-stretch:75%;font-variant-numeric:tabular-nums;line-height:1;white-space:nowrap;letter-spacing:-.2px}
.hl{background:linear-gradient(transparent 52%,var(--hl) 52%,var(--hl) 92%,transparent 92%);padding:0 2px}
.row{display:flex;align-items:center;gap:12px}.sb{justify-content:space-between}.wrap{flex-wrap:wrap}.end{align-items:flex-end}.base{align-items:baseline}
.col{display:flex;flex-direction:column;gap:10px}.g4{gap:4px}.g6{gap:6px}.g16{gap:16px}
.grow{flex:1;min-width:0}
/* surfaces: a sheet of paper laid on the grid; used sparingly */
.card{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:14px 16px}
.card.hl{border-color:var(--ink);border-width:2px}
.card.warn{border-color:var(--warn);background:var(--warnbg)}
.item{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:12px 14px;min-height:68px;color:var(--ink)}
.item.on{border-color:var(--ok)}
.item .t{font-weight:700;font-size:16px;line-height:1.25}
.thumb{display:block;width:52px;height:44px;flex:none;border-radius:10px;overflow:hidden;background:var(--paper2);position:relative;border:1px solid var(--rule)}
.thumb svg{width:100%;height:100%}
.thumb .ck{position:absolute;inset:0;background:rgba(30,122,74,.82);color:#fff;display:flex;align-items:center;justify-content:center}
.demo{border-radius:14px;overflow:hidden;background:var(--paper2);position:relative;aspect-ratio:200/170;width:100%;border:1px solid var(--rule)}
.demo svg{width:100%;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:5px;margin-right:5px;vertical-align:-1px}
.cues{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.lgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.lcard{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0;color:var(--ink)}
.lcard .thumb{width:100%;height:auto;aspect-ratio:200/170}
.lcard b{font-size:14px;line-height:1.25}
/* buttons: ink (primary), outline (secondary), text link */
.btn{min-height:54px;border-radius:12px;border:0;background:var(--btn);color:var(--onbtn);font-weight:800;font-size:17px;font-stretch:108%;transition:transform .08s;width:100%;padding:0 18px;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.light{background:var(--card);color:var(--ink);border:2px solid var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.btn.hlb{background:var(--hl);color:#18233A}
.btn2{min-height:44px;border-radius:10px;border:1.5px solid var(--rule2);background:var(--card);font-size:15px;font-weight:600;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--ink)}
.btn2.fill{background:var(--paper2)}
.btn2.danger{border-color:var(--red);color:var(--red)}
.btn2.acb{border-color:var(--ink);border-width:2px}
.link{background:none;border:0;padding:0;color:var(--ink);font-weight:700;font-size:15px;min-height:44px;display:inline-flex;align-items:center;gap:6px;text-align:left;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;text-decoration-color:var(--hl)}
.link.mutl{color:var(--ink2);text-decoration-color:var(--rule2)}
.chips{display:grid;gap:8px}
.chip{min-height:48px;border-radius:10px;border:1.5px solid var(--rule2);background:var(--card);font-weight:700;font-size:16px;padding:0 6px;line-height:1.15;color:var(--ink)}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip small{display:block;font-size:12px;font-weight:500;opacity:.85}
.pill{padding:6px 10px;border-radius:8px;background:var(--paper2);font-size:14px;white-space:nowrap}
button.pill{border:1.5px solid var(--rule2);min-height:44px;color:var(--ink)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:6px;font-size:13px;font-weight:700;background:var(--hl2);color:var(--ink);white-space:nowrap;vertical-align:1px}
.tag.warn{background:var(--warnbg);color:var(--warn)}
.tag.ok{background:var(--okbg);color:var(--ok)}
.tag.rec{background:transparent;color:var(--red);border:1.5px solid var(--red)}
.tag.grey{background:var(--paper2);color:var(--ink2)}
.bar{height:8px;border-radius:4px;background:var(--paper2);overflow:hidden;border:1px solid var(--rule)}.bar>i{display:block;height:100%;background:var(--ink);border-radius:3px}
.bar>i.over{background:var(--warn)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.wday{background:none;border:0;padding:2px 0;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:66px;color:var(--ink)}
.day{width:38px;height:38px;border-radius:19px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;border:1.5px solid var(--rule2);color:var(--ink2);font-variant-numeric:tabular-nums}
.day.done{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.day.today{box-shadow:0 0 0 3px var(--hl);border-color:var(--ink);color:var(--ink)}
.day.today.done{color:var(--paper)}
.dlab{font-size:11px;color:var(--ink2);height:14px;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
nav#nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1.5px solid var(--ink);padding:6px 4px calc(8px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(5,1fr);max-width:480px;margin:0 auto;z-index:5}
nav#nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:50px;color:var(--ink2);font-size:12px;font-weight:600;position:relative}
nav#nav button[aria-current]{color:var(--ink);font-weight:800}
nav#nav button[aria-current] svg{background:var(--hl);border-radius:8px;box-shadow:0 0 0 4px var(--hl);color:#18233A}
nav#nav .live{position:absolute;top:2px;right:calc(50% - 18px);width:10px;height:10px;border-radius:5px;background:var(--red);box-shadow:0 0 0 2px var(--card)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* sheets follow the visible viewport, so the keyboard never hides the bottom button */
.sheet{position:fixed;left:0;right:0;top:0;height:var(--vvh,100%);background:var(--shade);display:flex;flex-direction:column;justify-content:flex-end;z-index:10}
.sheet>div{background:var(--paper);border-top:2px solid var(--ink);border-radius:20px 20px 0 0;padding:12px 18px 0;max-height:94%;overflow:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:16px;max-width:480px;width:100%;margin:0 auto}
.sheet>div>*{flex-shrink:0}
.sheet>div::after{content:'';display:block;min-height:calc(20px + env(safe-area-inset-bottom,0px))}
.sheet>div:has(> .sfoot)::after{display:none}
.sfoot{position:sticky;bottom:0;margin:auto -18px 0;padding:12px 18px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,transparent,var(--paper) 14px);display:flex;flex-direction:column;gap:8px;z-index:2}
.grab{width:40px;height:5px;border-radius:3px;background:var(--rule2);margin:0 auto -4px;flex:none}
.x{width:44px;height:44px;border-radius:22px;border:1.5px solid var(--rule2);background:var(--card);flex:none;font-size:20px;display:flex;align-items:center;justify-content:center;padding:0;color:var(--ink)}
.x.s{width:40px;height:40px;border-radius:20px}
.x.acx{background:var(--ink);color:var(--paper);border:0}
.round{width:60px;height:60px;border-radius:30px;border:1.5px solid var(--rule2);background:var(--card);font-size:28px;flex:none;color:var(--ink)}
.round.ac{background:var(--ink);color:var(--paper);border:0}
.full{position:fixed;left:0;right:0;top:0;height:var(--vvh,100%);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px 22px calc(24px + env(safe-area-inset-bottom,0px));text-align:center;overflow:auto;background:var(--paper)}
.rec{background:var(--hl);color:#18233A}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tiles.t2{grid-template-columns:repeat(2,1fr)}
.tile{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .num{font-size:28px}
.hist{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--rule);min-height:48px}
.hist:last-child{border-bottom:0}
button.hist{background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;color:var(--ink);font-size:15px}
.seg{display:flex;padding:3px;border-radius:12px;background:var(--paper2);border:1px solid var(--rule);overflow-x:auto;gap:2px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{min-width:44px;min-height:40px;padding:0 12px;border:0;border-radius:9px;background:none;color:var(--ink2);font-size:14px;font-weight:700;white-space:nowrap;position:relative;flex:1 0 auto}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 0 0 1.5px var(--ink)}
.seg button .dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:4px;background:var(--red)}
input,select,textarea{width:100%;min-height:48px;border-radius:10px;border:1.5px solid var(--rule2);background:var(--card);padding:0 14px;font-size:16px;color:var(--ink)}
textarea{padding:12px 14px;min-height:80px;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--ink3)}
input:focus,select:focus,textarea:focus{border-color:var(--ink);outline:none;box-shadow:0 0 0 3px var(--hl2)}
input[aria-invalid="true"]{border-color:var(--red);box-shadow:0 0 0 3px rgba(191,47,44,.15)}
label{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--ink2);font-weight:600}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mus{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.mus div{border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;gap:8px;font-size:14px;border:1px solid var(--rule)}
.mus div span:first-child{text-transform:capitalize}
.empty{border:1.5px dashed var(--rule2);border-radius:14px;padding:18px;color:var(--ink2);text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;background:var(--card)}
.vol{display:grid;grid-template-columns:96px 1fr 40px;align-items:center;gap:10px;font-size:14px;min-height:30px}
.vol>span:first-child{text-transform:capitalize}
.vtrack{position:relative;height:10px;border-radius:5px;background:var(--paper2);border:1px solid var(--rule)}
.vtrack .zone{position:absolute;top:0;bottom:0;background:var(--hl2);border-radius:5px}
.vtrack i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--ink)}
.vtrack i.ok{background:var(--ok)}.vtrack i.hi{background:var(--warn)}
.spill{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;align-items:center;gap:10px;background:var(--hl);color:#18233A;border:2px solid #18233A;border-radius:24px;padding:0 16px 0 12px;min-height:46px;font-weight:800;box-shadow:var(--sh);white-space:nowrap}
.spill i{width:9px;height:9px;border-radius:5px;background:var(--red)}
@media (prefers-reduced-motion:no-preference){.spill i{animation:blink 1.4s infinite}}
@keyframes blink{50%{opacity:.25}}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));box-shadow:var(--sh);transform:translateX(-50%);background:var(--ink);color:var(--paper);border-radius:12px;padding:8px 8px 8px 14px;font-size:15px;font-weight:600;z-index:40;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px);width:max-content}
.toast button{background:var(--hl);color:#18233A;border:0;border-radius:8px;font-weight:800;min-height:40px;padding:0 12px}
details summary{cursor:pointer;list-style:none;min-height:44px;display:flex;align-items:center;gap:8px}
details summary::-webkit-details-marker{display:none}
details.fold{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:0 14px}
details.fold[open]{padding-bottom:14px}
details.fold summary{font-size:15px;font-weight:700;color:var(--ink)}
details.fold summary::after{content:'';margin-left:auto;width:8px;height:8px;border-right:2px solid var(--ink2);border-bottom:2px solid var(--ink2);transform:rotate(45deg) translateY(-2px)}
details.fold[open] summary::after{transform:rotate(-135deg)}
.btn:active,.item:active,.chip:active,.round:active,.tick:active{transform:scale(.96)}
.item,.chip,.round,.tick{transition:transform .08s}

/* ---------- the logbook page (session) ---------- */
.page-head{display:flex;flex-direction:column;gap:8px}
.page-head .date{font-size:15px;font-weight:600;color:var(--ink2)}
.page-head h1{font-size:44px}
.meta{font-size:15px;color:var(--ink2)}
.livebar{display:flex;align-items:center;gap:10px;font-weight:700}
.livebar .dotr{width:10px;height:10px;border-radius:5px;background:var(--red);flex:none}
.exb{background:var(--card);border:1px solid var(--rule);border-radius:14px;overflow:hidden}
.exb.done{border-color:var(--ok)}
.exb.cur{border:2px solid var(--ink);box-shadow:var(--sh)}
.exh{display:flex;align-items:center;gap:12px;padding:12px 12px 10px 12px;width:100%;background:none;border:0;text-align:left;color:var(--ink)}
.exh .t{font-weight:800;font-size:17px;font-stretch:104%;line-height:1.2}
.exh .p{font-size:14px;color:var(--ink2);margin-top:2px}
.exh .goal{font-size:14px;margin-top:4px}
.exb .tools{display:flex;gap:4px}
.srows{border-top:1px solid var(--rule)}
.srow{display:grid;grid-template-columns:34px 1fr 18px 1fr 54px;align-items:center;gap:6px;padding:6px 10px 6px 8px;border-bottom:1px solid var(--rule);min-height:58px}
.srow:last-child{border-bottom:0}
.srow .n{font-weight:800;font-stretch:75%;font-size:20px;color:var(--ink3);text-align:center;font-variant-numeric:tabular-nums}
.srow .xx{color:var(--ink3);text-align:center;font-weight:700}
.srow .fld{display:flex;flex-direction:row;align-items:center;gap:4px;min-width:0}
.srow .fld input{min-height:44px;height:44px;border-radius:8px;padding:0 8px;text-align:right;font-weight:800;font-stretch:80%;font-size:22px;font-variant-numeric:tabular-nums;border-color:var(--rule)}
.srow .fld span{font-size:13px;color:var(--ink2);font-weight:600;flex:none}
.srow.now{background:var(--hl2)}
.srow.now .n{color:var(--ink)}
.srow.done .val{font-weight:800;font-stretch:80%;font-size:22px;font-variant-numeric:tabular-nums}
.srow.done{background:transparent}
.srow.warm .n{font-size:13px}
.tick{width:48px;height:48px;border-radius:12px;border:2px solid var(--ink);background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--ink);justify-self:end;padding:0}
.srow.now .tick{background:var(--ink);color:var(--paper)}
.tick.on{background:var(--ok);border-color:var(--ok);color:#fff}
.srow .vbtn{grid-column:2/5;display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;min-height:44px;color:var(--ink);text-align:left}
.addrow{display:flex;gap:4px;padding:2px 8px 6px}
.feelq{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%;max-width:360px}
.feelq .chip{min-height:52px;font-size:15px}

/* ---------- misc components kept from v4 ---------- */
.hero{position:relative;background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.hero .eyebrow{font-size:15px;font-weight:700;color:var(--ink2)}
.hero .meta{position:relative}
.lvl{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--rule);border-radius:30px;padding:3px 12px 3px 3px;min-height:44px;color:var(--ink)}
.lvl b{font-weight:800;font-size:15px}
.lvl small{display:block;font-size:12px;color:var(--ink2)}
.streak{display:flex;align-items:center;gap:6px;font-weight:800;font-size:17px;font-stretch:108%}
.chal{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;min-height:44px}
.chal .ck2{width:24px;height:24px;border-radius:6px;border:2px solid var(--rule2);display:flex;align-items:center;justify-content:center}
.chal .ck2.on{background:var(--ok);border-color:var(--ok);color:#fff}
.chal .bar{height:6px}
.bgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 8px}

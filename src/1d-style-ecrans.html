<style>
/* ---------- écrans : Progrès, bilan, exercice, records, bibliothèque, corps, nutrition, Moi, accueil du 1er lancement ----------
   Une couleur = une classe .sc-<nom> qui fixe --c (couleur pleine). Tout le reste en découle, dans les deux thèmes :
   --cbg teinte de fond, --ctx texte lisible sur cette teinte (≥ 4,5:1), --cn grands chiffres. Aucune couleur hors tokens. */
:root{--sc-goldtx:color-mix(in srgb,var(--gold) 42%,var(--ink));--sc-goldbg:color-mix(in srgb,var(--gold) 15%,var(--card))}
.sc-ac{--c:var(--ac)}.sc-ok{--c:var(--ok)}.sc-warn{--c:var(--warn)}.sc-red{--c:var(--red)}
.sc-push{--c:var(--push)}.sc-pull{--c:var(--pull)}.sc-legs{--c:var(--legs)}.sc-glute{--c:var(--glute)}.sc-core{--c:var(--core)}
.sc-ink{--c:var(--ink2)}.sc-prot{--c:var(--prot)}.sc-carb{--c:var(--carb)}.sc-fat{--c:var(--fat)}.sc-water{--c:var(--water)}.sc-gold{--c:var(--gold)}
.sc-ac,.sc-ink,.sc-ok,.sc-warn,.sc-red,.sc-push,.sc-pull,.sc-legs,.sc-glute,.sc-core,.sc-prot,.sc-carb,.sc-fat,.sc-water,.sc-gold{
 --cbg:color-mix(in srgb,var(--c) 13%,var(--card));--cbg2:color-mix(in srgb,var(--c) 24%,var(--card));
 --ctx:color-mix(in srgb,var(--c) 70%,var(--ink));--cn:color-mix(in srgb,var(--c) 86%,var(--ink))}
.sc-gold{--cbg:var(--sc-goldbg);--cbg2:color-mix(in srgb,var(--gold) 28%,var(--card));--ctx:var(--sc-goldtx);--cn:var(--sc-goldtx)}
.sc-tx{color:var(--ctx)}.sc-cn{color:var(--cn)}
/* small pieces */
.sc-ico{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:12px;background:var(--cbg2);color:var(--ctx)}
.sc-ico.lg{width:52px;height:52px;border-radius:14px}
.sc-dot{display:inline-block;width:10px;height:10px;flex:none;border-radius:3px;background:var(--c);vertical-align:0}
.sc-tag{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;background:var(--cbg2);color:var(--ctx);font-size:13px;font-weight:700;line-height:1.35;white-space:nowrap;vertical-align:1px}
.col>.sc-tag{align-self:flex-start}
.sc-dots{display:inline-flex;gap:3px;vertical-align:1px;margin-left:6px}.sc-dots i{width:8px;height:8px;border-radius:2px;background:var(--c)}
/* tinted thumbnails: the drawing background takes the muscle family colour */
.sc-th .thumb{box-shadow:inset 0 0 0 1.5px var(--cbg2)}
.sc-th .thumb>svg>rect:first-child,.sc-ex .demo>svg>rect:first-child{fill:var(--cbg)}
.sc-th .thumb>svg>rect[height="60"],.sc-ex .demo>svg>rect[height="60"]{fill:var(--cbg2)}
/* stat tiles */
.sc-tile{position:relative;gap:6px;background:var(--cbg);border-color:transparent;overflow:hidden}
.sc-tile::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.sc-tile .num{color:var(--cn)}
.sc-tile .sc-tk{display:flex;align-items:center;gap:6px;color:var(--ctx);font-size:13px;font-weight:700;line-height:1.25}
.sc-tile .sc-tk svg.i{width:18px;height:18px}
.sc-tile .sc-tl{color:var(--ctx);font-weight:600}
.sc-tile .mut{color:var(--ink2)}
/* list rows */
.sc-n{font-size:20px;color:var(--cn)}
.sc-date{width:46px;height:46px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;background:var(--cbg2);color:var(--ctx);line-height:1}
.sc-date b{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}.sc-date span{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;margin-top:2px}
/* month hero */
.sc-hero{display:flex;flex-direction:column;gap:6px;padding:20px;border-radius:20px;background:var(--grad);color:#fff;box-shadow:var(--shadow)}
.sc-hero .sc-eb{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.6px}
.sc-hero .num{color:#fff}
.sc-hero .sc-ha{display:flex;align-items:center;gap:14px;margin-top:8px;padding-top:14px;border-top:1px solid rgba(255,255,255,.3)}
.sc-hero .sc-pct{flex:none;padding:8px 12px;border-radius:14px;background:rgba(255,255,255,.18);font-size:30px}
.sc-wb .wbars .wb i.sc-part{background:var(--ac)}
.sc-wb .wbars{height:144px}
.sc-wb .wbars .wb .num{position:relative;z-index:1;padding:0 4px;border-radius:4px;background:var(--card)}
.sc-wb .wbars .goal{border-top-color:var(--ok)}
.sc-vol .vol{grid-template-columns:112px 1fr 40px}
.sc-vol .vol>span:first-child{display:flex;align-items:center;gap:8px}
.sc-vol .vtrack .zone{background:var(--okbg)}
.sc-vol .vtrack i,.sc-vol .vtrack i.ok,.sc-vol .vtrack i.hi{background:var(--c)}
.sc-bar>i{background:var(--c)}
/* exercise page */
.sc-exh{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:18px;background:var(--cbg);border:1px solid var(--cbg2)}
.sc-exh h1{margin:0}
.sc-exh .pill{background:var(--card);color:var(--ink2);font-size:14px;padding:4px 10px}
.sc-exh .pill.b{color:var(--ctx);box-shadow:inset 0 0 0 1.5px var(--c)}
.sc-ex .seg button.on{color:var(--ctx)}
.sc-ex .std i.on{background:var(--c)}
.sc-ex .xpbar i{background:var(--c)}
.sc-ex .hist .sc-d{width:72px;flex:none;color:var(--ctx);font-weight:700}
/* records */
.sc-goldcard{background:var(--sc-goldbg);border-color:color-mix(in srgb,var(--gold) 40%,var(--card))}
.sc-goldcard .hist{border-bottom-color:color-mix(in srgb,var(--gold) 30%,var(--card))}
.sc-goldcard .num{color:var(--sc-goldtx)}
/* library family chips: 3 × 2 grid */
.sc-fchips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sc-fchip{display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 8px;border-radius:12px;border:1.5px solid var(--line2);background:var(--card);color:var(--ink);font-weight:700;font-size:15px}
.sc-fchip small{font-size:12px;font-weight:600;color:var(--ink3)}
.sc-fchip.on{border:2px solid var(--c,var(--ink));background:var(--cbg2,var(--soft));color:var(--ctx,var(--ink))}
.sc-fchip.on small{color:inherit}
.sc-fchip.all.on{border-color:var(--ink);background:var(--soft);color:var(--ink)}
.sc-mchips{display:flex;flex-wrap:wrap;gap:6px}
.sc-mchips button{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line2);background:var(--card);color:var(--ink2);font-weight:600;font-size:14px}
.sc-mchips button.on{border-color:var(--c);background:var(--cbg2);color:var(--ctx)}
/* corps */
.sc-mtile{text-align:left}
.sc-mtile.on{background:var(--cbg);border:2px solid var(--c)}
.sc-mtile.on .num{color:var(--cn)}
.sc-lv{display:inline-flex;gap:4px}.sc-lv i{width:10px;height:10px;border-radius:3px;background:var(--soft);box-shadow:inset 0 0 0 1.5px var(--line2)}
.sc-lv i.on{background:var(--c);box-shadow:none}
.sc-mus div{flex-direction:column;justify-content:center;gap:2px;min-height:58px;background:var(--card)}
.sc-mus div .xs{padding-left:18px}
.sc-mus div.hot{background:var(--cbg);border-color:var(--cbg2)}
.sc-mus div span:first-child{display:flex;align-items:center;gap:8px}
.sc-mus div.hot .xs{color:var(--ctx);font-weight:700}
/* nutrition */
.sc-mac{display:flex;align-items:center;gap:8px}
.sc-water .x.acx{background:var(--water);color:var(--onac)}
.sc-glass{flex:1;height:8px;border-radius:3px;background:var(--soft)}.sc-glass.on{background:var(--water)}
.sc-meal{gap:0}
.sc-meal .food{min-height:44px;padding:8px 0 8px 56px;gap:10px}
.sc-meal .sc-mh+.food{margin-top:12px;border-top:1px solid var(--line)}
.sc-meal .food:last-child{padding-bottom:0;min-height:40px}
.sc-meal .food+.link{margin:2px 0 -8px 56px}
.sc-meal .sc-fi{gap:1px;min-width:0}
/* Moi */
.sc-av{width:56px;height:56px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:16px;background:var(--grad);color:#fff;font-size:24px;font-weight:800}
/* onboarding */
.sc-brand{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:800;color:var(--ink)}
.sc-brand .sc-logo{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:var(--grad);color:#fff}
.sc-prog{align-items:flex-start}
.sc-prog .sc-ico{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.sc-prog.on{border:2px solid var(--c);background:var(--cbg)}
.sc-prog.on>svg.i{color:var(--ctx)}
.sc-mix{display:flex;gap:2px;height:6px;margin-top:8px;border-radius:3px;overflow:hidden}
.sc-mix i{height:100%;background:var(--c)}
.sc-mixl{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px;font-size:12px;color:var(--ink2)}
.sc-mixl span{display:inline-flex;align-items:center;gap:5px}.sc-mixl .sc-dot{width:8px;height:8px}
/* sub-page top bar: back + parent name; counts and dates in a subtitle under the h1 */
.sc-top{gap:8px}.sc-top>.sm{font-weight:600}
.sc-ht{gap:4px}.sc-sub{font-size:15px;font-weight:500;color:var(--ink2)}
.sc-nw{white-space:nowrap}
/* Progrès rows: same two-line structure on every row */
.sc-exs{gap:8px;margin-top:4px;flex-wrap:nowrap}.sc-gain{white-space:nowrap}
/* two tiles side by side: label on one line, value then date pinned to the bottom */
.sc-tile .sc-tk{white-space:nowrap}
.sc-t2 .sc-tile .sc-tv{font-size:22px;white-space:nowrap}
.sc-t2 .sc-tile .xs{margin-top:auto}
.sc-exh .pill.sc-kind{background:none;color:var(--ink2);box-shadow:inset 0 0 0 1.5px var(--line2)}
/* trophies: progress under the medal, in the medal's colour; the slot is always there so labels line up */
.sc-bp{display:block;width:62%;height:5px;margin:1px 0 2px;border-radius:3px;background:var(--soft);overflow:hidden}
.sc-bp i{display:block;height:100%;border-radius:3px;background:var(--c)}
/* food quantity chips: the chosen amount is highlighted */
.sc-qset .btn2.on{background:var(--cbg2);border-color:var(--c);color:var(--ctx)}
/* exercise settings segments: share the width, long labels wrap instead of overflowing the card */
.seg.sc-segw{overflow:visible}
.seg.sc-segw button{flex:1 1 0;min-width:0;padding:6px 6px;font-size:14px;line-height:1.2;white-space:normal;text-align:center;overflow-wrap:anywhere}
</style>

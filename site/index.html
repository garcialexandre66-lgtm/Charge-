<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EEF1EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121722" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Charge">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Charge</title>
<link rel="stylesheet" crossorigin href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
<style>
/* Charge 5 — "carnet de fonte": a training logbook page. Cool graph paper, blue-black ink,
   a yellow highlighter on what you must lift now, red pen for records and failures, green for done sets.
   One type family (Archivo) used across its width axis: wide and heavy for titles, narrow for numbers, normal for text.
   Layout: one column ≤ 480 px; the session is a ruled table (one line per set, one tap to validate). */
:root{
 --paper:#EEF1EC;--paper2:#E3E8E1;--card:#F8FAF6;--grid:rgba(24,35,58,.055);
 --ink:#18233A;--ink2:#465169;--ink3:#5F687B;--rule:#CBD2C8;--rule2:#B3BCB1;
 --hl:#FFE04A;--hl2:rgba(255,224,74,.45);--red:#BF2F2C;--ok:#1E7A4A;--okbg:rgba(30,122,74,.12);--warn:#9A5B00;--warnbg:rgba(178,106,0,.12);
 --btn:#18233A;--onbtn:#FFFFFF;--shade:rgba(24,35,58,.38);--sh:0 1px 0 rgba(24,35,58,.06),0 8px 24px rgba(24,35,58,.10);
 --fw:'Archivo',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
 color-scheme:light}
@media (prefers-color-scheme:dark){:root{
 --paper:#121722;--paper2:#1A2130;--card:#1E2635;--grid:rgba(233,237,243,.04);
 --ink:#E9EDF3;--ink2:#B2BBCB;--ink3:#97A1B3;--rule:#2C3546;--rule2:#3B4659;
 --hl:#FFD83D;--hl2:rgba(255,216,61,.28);--red:#FF7468;--ok:#4CC38A;--okbg:rgba(76,195,138,.14);--warn:#F2B13D;--warnbg:rgba(242,177,61,.14);
 --btn:#FFD83D;--onbtn:#121722;--shade:rgba(0,0,0,.6);--sh:0 8px 24px rgba(0,0,0,.4);color-scheme:dark}}
html,body{height:100%}
body{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;
 color:var(--ink);font:400 16px/1.45 var(--fw);font-stretch:100%;margin:0;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:6px}
[tabindex="-1"]:focus,[tabindex="-1"]:focus-visible{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{max-width:480px;margin:0 auto;min-height:100%;padding:20px 18px 132px;display:flex;flex-direction:column;gap:22px}
/* type scale: 13 · 15 · 16 · 20 · 26 · 40 */
h1{margin:0;font:900 40px/1 var(--fw);font-stretch:118%;letter-spacing:-.5px;text-wrap:balance}
h1.md{font-size:30px}
h2{margin:0;font:800 20px/1.15 var(--fw);font-stretch:110%}
.lbl{font-size:15px;font-weight:700;color:var(--ink);margin:0}
.mut{color:var(--ink2)}.dim{color:var(--ink3)}.sm{font-size:15px}.xs{font-size:13px;line-height:1.4}.ac{color:var(--ink);font-weight:700}.okc{color:var(--ok)}.warnc{color:var(--warn)}.redc{color:var(--red)}
.b{font-weight:700}
.num{font-weight:800;font-stretch:75%;font-variant-numeric:tabular-nums;line-height:1;white-space:nowrap;letter-spacing:-.2px}
.hl{background:linear-gradient(transparent 52%,var(--hl) 52%,var(--hl) 92%,transparent 92%);padding:0 2px}
.row{display:flex;align-items:center;gap:12px}.sb{justify-content:space-between}.wrap{flex-wrap:wrap}.end{align-items:flex-end}.base{align-items:baseline}
.col{display:flex;flex-direction:column;gap:10px}.g4{gap:4px}.g6{gap:6px}.g16{gap:16px}
.grow{flex:1;min-width:0}
/* surfaces: a sheet of paper laid on the grid; used sparingly */
.card{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:14px 16px}
.card.hl{border-color:var(--ink);border-width:2px}
.card.warn{border-color:var(--warn);background:var(--warnbg)}
.item{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:12px 14px;min-height:68px;color:var(--ink)}
.item.on{border-color:var(--ok)}
.item .t{font-weight:700;font-size:16px;line-height:1.25}
.thumb{display:block;width:52px;height:44px;flex:none;border-radius:10px;overflow:hidden;background:var(--paper2);position:relative;border:1px solid var(--rule)}
.thumb svg{width:100%;height:100%}
.thumb .ck{position:absolute;inset:0;background:rgba(30,122,74,.82);color:#fff;display:flex;align-items:center;justify-content:center}
.demo{border-radius:14px;overflow:hidden;background:var(--paper2);position:relative;aspect-ratio:200/170;width:100%;border:1px solid var(--rule)}
.demo svg{width:100%;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:5px;margin-right:5px;vertical-align:-1px}
.cues{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.lgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.lcard{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0;color:var(--ink)}
.lcard .thumb{width:100%;height:auto;aspect-ratio:200/170}
.lcard b{font-size:14px;line-height:1.25}
/* buttons: ink (primary), outline (secondary), text link */
.btn{min-height:54px;border-radius:12px;border:0;background:var(--btn);color:var(--onbtn);font-weight:800;font-size:17px;font-stretch:108%;transition:transform .08s;width:100%;padding:0 18px;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.light{background:var(--card);color:var(--ink);border:2px solid var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.btn.hlb{background:var(--hl);color:#18233A}
.btn2{min-height:44px;border-radius:10px;border:1.5px solid var(--rule2);background:var(--card);font-size:15px;font-weight:600;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--ink)}
.btn2.fill{background:var(--paper2)}
.btn2.danger{border-color:var(--red);color:var(--red)}
.btn2.acb{border-color:var(--ink);border-width:2px}
.link{background:none;border:0;padding:0;color:var(--ink);font-weight:700;font-size:15px;min-height:44px;display:inline-flex;align-items:center;gap:6px;text-align:left;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;text-decoration-color:var(--hl)}
.link.mutl{color:var(--ink2);text-decoration-color:var(--rule2)}
.chips{display:grid;gap:8px}
.chip{min-height:48px;border-radius:10px;border:1.5px solid var(--rule2);background:var(--card);font-weight:700;font-size:16px;padding:0 6px;line-height:1.15;color:var(--ink)}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip small{display:block;font-size:12px;font-weight:500;opacity:.85}
.pill{padding:6px 10px;border-radius:8px;background:var(--paper2);font-size:14px;white-space:nowrap}
button.pill{border:1.5px solid var(--rule2);min-height:44px;color:var(--ink)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:6px;font-size:13px;font-weight:700;background:var(--hl2);color:var(--ink);white-space:nowrap;vertical-align:1px}
.tag.warn{background:var(--warnbg);color:var(--warn)}
.tag.ok{background:var(--okbg);color:var(--ok)}
.tag.rec{background:transparent;color:var(--red);border:1.5px solid var(--red)}
.tag.grey{background:var(--paper2);color:var(--ink2)}
.bar{height:8px;border-radius:4px;background:var(--paper2);overflow:hidden;border:1px solid var(--rule)}.bar>i{display:block;height:100%;background:var(--ink);border-radius:3px}
.bar>i.over{background:var(--warn)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.wday{background:none;border:0;padding:2px 0;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:66px;color:var(--ink)}
.day{width:38px;height:38px;border-radius:19px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;border:1.5px solid var(--rule2);color:var(--ink2);font-variant-numeric:tabular-nums}
.day.done{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.day.today{box-shadow:0 0 0 3px var(--hl);border-color:var(--ink);color:var(--ink)}
.day.today.done{color:var(--paper)}
.dlab{font-size:11px;color:var(--ink2);height:14px;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
nav#nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1.5px solid var(--ink);padding:6px 4px calc(8px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(5,1fr);max-width:480px;margin:0 auto;z-index:5}
nav#nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:50px;color:var(--ink2);font-size:12px;font-weight:600;position:relative}
nav#nav button[aria-current]{color:var(--ink);font-weight:800}
nav#nav button[aria-current] svg{background:var(--hl);border-radius:8px;box-shadow:0 0 0 4px var(--hl);color:#18233A}
nav#nav .live{position:absolute;top:2px;right:calc(50% - 18px);width:10px;height:10px;border-radius:5px;background:var(--red);box-shadow:0 0 0 2px var(--card)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* sheets follow the visible viewport, so the keyboard never hides the bottom button */
.sheet{position:fixed;left:0;right:0;top:0;height:var(--vvh,100%);background:var(--shade);display:flex;flex-direction:column;justify-content:flex-end;z-index:10}
.sheet>div{background:var(--paper);border-top:2px solid var(--ink);border-radius:20px 20px 0 0;padding:12px 18px 0;max-height:94%;overflow:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:16px;max-width:480px;width:100%;margin:0 auto}
.sheet>div>*{flex-shrink:0}
.sheet>div::after{content:'';display:block;min-height:calc(20px + env(safe-area-inset-bottom,0px))}
.sheet>div:has(> .sfoot)::after{display:none}
.sfoot{position:sticky;bottom:0;margin:auto -18px 0;padding:12px 18px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,transparent,var(--paper) 14px);display:flex;flex-direction:column;gap:8px;z-index:2}
.grab{width:40px;height:5px;border-radius:3px;background:var(--rule2);margin:0 auto -4px;flex:none}
.x{width:44px;height:44px;border-radius:22px;border:1.5px solid var(--rule2);background:var(--card);flex:none;font-size:20px;display:flex;align-items:center;justify-content:center;padding:0;color:var(--ink)}
.x.s{width:40px;height:40px;border-radius:20px}
.x.acx{background:var(--ink);color:var(--paper);border:0}
.round{width:60px;height:60px;border-radius:30px;border:1.5px solid var(--rule2);background:var(--card);font-size:28px;flex:none;color:var(--ink)}
.round.ac{background:var(--ink);color:var(--paper);border:0}
.full{position:fixed;left:0;right:0;top:0;height:var(--vvh,100%);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px 22px calc(24px + env(safe-area-inset-bottom,0px));text-align:center;overflow:auto;background:var(--paper)}
.rec{background:var(--hl);color:#18233A}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tiles.t2{grid-template-columns:repeat(2,1fr)}
.tile{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .num{font-size:28px}
.hist{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--rule);min-height:48px}
.hist:last-child{border-bottom:0}
button.hist{background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;color:var(--ink);font-size:15px}
.seg{display:flex;padding:3px;border-radius:12px;background:var(--paper2);border:1px solid var(--rule);overflow-x:auto;gap:2px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{min-width:44px;min-height:40px;padding:0 12px;border:0;border-radius:9px;background:none;color:var(--ink2);font-size:14px;font-weight:700;white-space:nowrap;position:relative;flex:1 0 auto}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 0 0 1.5px var(--ink)}
.seg button .dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:4px;background:var(--red)}
input,select,textarea{width:100%;min-height:48px;border-radius:10px;border:1.5px solid var(--rule2);background:var(--card);padding:0 14px;font-size:16px;color:var(--ink)}
textarea{padding:12px 14px;min-height:80px;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--ink3)}
input:focus,select:focus,textarea:focus{border-color:var(--ink);outline:none;box-shadow:0 0 0 3px var(--hl2)}
input[aria-invalid="true"]{border-color:var(--red);box-shadow:0 0 0 3px rgba(191,47,44,.15)}
label{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--ink2);font-weight:600}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mus{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.mus div{border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;gap:8px;font-size:14px;border:1px solid var(--rule)}
.mus div span:first-child{text-transform:capitalize}
.empty{border:1.5px dashed var(--rule2);border-radius:14px;padding:18px;color:var(--ink2);text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;background:var(--card)}
.vol{display:grid;grid-template-columns:96px 1fr 40px;align-items:center;gap:10px;font-size:14px;min-height:30px}
.vol>span:first-child{text-transform:capitalize}
.vtrack{position:relative;height:10px;border-radius:5px;background:var(--paper2);border:1px solid var(--rule)}
.vtrack .zone{position:absolute;top:0;bottom:0;background:var(--hl2);border-radius:5px}
.vtrack i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--ink)}
.vtrack i.ok{background:var(--ok)}.vtrack i.hi{background:var(--warn)}
.spill{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;align-items:center;gap:10px;background:var(--hl);color:#18233A;border:2px solid #18233A;border-radius:24px;padding:0 16px 0 12px;min-height:46px;font-weight:800;box-shadow:var(--sh);white-space:nowrap}
.spill i{width:9px;height:9px;border-radius:5px;background:var(--red)}
@media (prefers-reduced-motion:no-preference){.spill i{animation:blink 1.4s infinite}}
@keyframes blink{50%{opacity:.25}}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));box-shadow:var(--sh);transform:translateX(-50%);background:var(--ink);color:var(--paper);border-radius:12px;padding:8px 8px 8px 14px;font-size:15px;font-weight:600;z-index:40;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px);width:max-content}
.toast button{background:var(--hl);color:#18233A;border:0;border-radius:8px;font-weight:800;min-height:40px;padding:0 12px}
details summary{cursor:pointer;list-style:none;min-height:44px;display:flex;align-items:center;gap:8px}
details summary::-webkit-details-marker{display:none}
details.fold{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:0 14px}
details.fold[open]{padding-bottom:14px}
details.fold summary{font-size:15px;font-weight:700;color:var(--ink)}
details.fold summary::after{content:'';margin-left:auto;width:8px;height:8px;border-right:2px solid var(--ink2);border-bottom:2px solid var(--ink2);transform:rotate(45deg) translateY(-2px)}
details.fold[open] summary::after{transform:rotate(-135deg)}
.btn:active,.item:active,.chip:active,.round:active,.tick:active{transform:scale(.96)}
.item,.chip,.round,.tick{transition:transform .08s}

/* ---------- the logbook page (session) ---------- */
.page-head{display:flex;flex-direction:column;gap:8px}
.page-head .date{font-size:15px;font-weight:600;color:var(--ink2)}
.page-head h1{font-size:44px}
.meta{font-size:15px;color:var(--ink2)}
.livebar{display:flex;align-items:center;gap:10px;font-weight:700}
.livebar .dotr{width:10px;height:10px;border-radius:5px;background:var(--red);flex:none}
.exb{background:var(--card);border:1px solid var(--rule);border-radius:14px;overflow:hidden}
.exb.done{border-color:var(--ok)}
.exb.cur{border:2px solid var(--ink);box-shadow:var(--sh)}
.exh{display:flex;align-items:center;gap:12px;padding:12px 12px 10px 12px;width:100%;background:none;border:0;text-align:left;color:var(--ink)}
.exh .t{font-weight:800;font-size:17px;font-stretch:104%;line-height:1.2}
.exh .p{font-size:14px;color:var(--ink2);margin-top:2px}
.exh .goal{font-size:14px;margin-top:4px}
.exb .tools{display:flex;gap:4px}
.srows{border-top:1px solid var(--rule)}
.srow{display:grid;grid-template-columns:34px 1fr 18px 1fr 54px;align-items:center;gap:6px;padding:6px 10px 6px 8px;border-bottom:1px solid var(--rule);min-height:58px}
.srow:last-child{border-bottom:0}
.srow .n{font-weight:800;font-stretch:75%;font-size:20px;color:var(--ink3);text-align:center;font-variant-numeric:tabular-nums}
.srow .xx{color:var(--ink3);text-align:center;font-weight:700}
.srow .fld{display:flex;flex-direction:row;align-items:center;gap:4px;min-width:0}
.srow .fld input{min-height:44px;height:44px;border-radius:8px;padding:0 8px;text-align:right;font-weight:800;font-stretch:80%;font-size:22px;font-variant-numeric:tabular-nums;border-color:var(--rule)}
.srow .fld span{font-size:13px;color:var(--ink2);font-weight:600;flex:none}
.srow.now{background:var(--hl2)}
.srow.now .n{color:var(--ink)}
.srow.done .val{font-weight:800;font-stretch:80%;font-size:22px;font-variant-numeric:tabular-nums}
.srow.done{background:transparent}
.srow.warm .n{font-size:13px}
.tick{width:48px;height:48px;border-radius:12px;border:2px solid var(--ink);background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--ink);justify-self:end;padding:0}
.srow.now .tick{background:var(--ink);color:var(--paper)}
.tick.on{background:var(--ok);border-color:var(--ok);color:#fff}
.srow .vbtn{grid-column:2/5;display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;min-height:44px;color:var(--ink);text-align:left}
.addrow{display:flex;gap:4px;padding:2px 8px 6px}
.feelq{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%;max-width:360px}
.feelq .chip{min-height:52px;font-size:15px}

/* ---------- misc components kept from v4 ---------- */
.hero{position:relative;background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.hero .eyebrow{font-size:15px;font-weight:700;color:var(--ink2)}
.hero .meta{position:relative}
.lvl{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--rule);border-radius:30px;padding:3px 12px 3px 3px;min-height:44px;color:var(--ink)}
.lvl b{font-weight:800;font-size:15px}
.lvl small{display:block;font-size:12px;color:var(--ink2)}
.streak{display:flex;align-items:center;gap:6px;font-weight:800;font-size:17px;font-stretch:108%}
.chal{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;min-height:44px}
.chal .ck2{width:24px;height:24px;border-radius:6px;border:2px solid var(--rule2);display:flex;align-items:center;justify-content:center}
.chal .ck2.on{background:var(--ok);border-color:var(--ok);color:#fff}
.chal .bar{height:6px}
.bgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 8px}

.std{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;position:relative;padding-top:14px}
.std i{height:10px;border-radius:3px;background:var(--paper2);border:1px solid var(--rule)}

.kgin:focus{border-bottom:3px solid var(--hl);border-radius:0;box-shadow:none}

.stepper{display:flex;align-items:center;gap:10px}
.stepper .num{font-size:40px;min-width:64px;text-align:center}

.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.cmp img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;display:block}

.star.on svg{fill:var(--hl)}
.spin{width:20px;height:20px;border-radius:10px;border:2px solid var(--rule2);border-top-color:var(--ink);flex:none}

@keyframes sp{to{transform:rotate(360deg)}}

.wbars .wb i.ok{background:var(--ink)}

.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--rule);font-size:15px}

.feelh{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}

.timer{font-weight:800;font-stretch:62%;font-size:132px;line-height:.9;font-variant-numeric:tabular-nums;letter-spacing:-2px}

 .sheet:not(.re)>div{animation:up .22s cubic-bezier(.2,.8,.2,1)}@keyframes up{from{transform:translateY(40px);opacity:.4}}

 ${S.progs.length>1?(view.delprog?`<div class="card col"><span>Supprimer « ${esc(pg.n)} » ? Les séances déjà faites restent dans l’historique avec leur nom.</span><div class="row"><button class="btn2 grow" data-a="delprog" data-v="0">Annuler</button><button class="btn2 grow danger" data-a="delprog" data-v="1">Supprimer</button></div></div>`:`<button class="link mutl" data-a="delprog" data-v="ask">Supprimer cette séance du programme</button>`):''}
 <div class="sfoot"><button class="btn" data-a="close">Terminé</button></div>`,'plan')}

/* ================= exercise picker ================= */
function exList(q){q=(q||'').trim().toLowerCase();const mode=view.pick,taken=new Set(mode==='plan'?prog().items.map(p=>p.id):mode==='today'?plan().map(p=>p.id):[]);
 const E=S.ex.filter(e=>!taken.has(e.id)&&(!q||e.n.toLowerCase().includes(q)||e.m.some(m=>m.includes(q))));
 if(!E.length)return `<div class="empty">Aucun exercice trouvé. Crée-le ci-dessous.</div>`;
 const by={};E.forEach(e=>(by[e.m[0]]=by[e.m[0]]||[]).push(e));
 return Object.keys(MUS).filter(m=>by[m]).map(m=>`<div class="col g4"><span class="lbl" style="margin-top:6px">${cap(m)}</span>${by[m].map(e=>`<button class="food" data-a="addex" data-v="${e.id}">${thumb(e.id)}<div class="grow"><div class="b">${esc(e.n)}</div><div class="xs mut">${KINDS[e.k]||''}${e.m.length>1?', '+e.m.slice(1).join(', '):''}${best(e.id)?', record '+fmt(best(e.id))+' kg':''}</div></div>${ic('plus',18)}</button>`).join('')}</div>`).join('')}
function pickSheet(mode){view.pick=mode;
 sheet(`<div class="grab"></div><div class="row sb"><h2 id="sheet-title" tabindex="-1" style="font-size:24px">${mode==='plan'?'Ajouter à « '+esc(prog().n)+' »':mode.startsWith('sess:')?'Exercice de la séance':'Exercice en plus'}</h2>${closeBtn}</div>
 ${mode==='today'?'<span class="sm mut">Ajouté seulement à la séance '+(active()?'en cours':'du jour')+'. Ton programme ne change pas.</span>':''}
 <input id="exq" data-i="exq" type="search" placeholder="Rechercher : presse, dorsaux, curl…" aria-label="Rechercher un exercice" autocomplete="off">
 <div id="exlist" class="col">${exList('')}</div>
 <details class="fold" ${view.newex?'open':''}><summary>${ic('plus',16)} Créer un exercice</summary><div class="col" style="margin-top:4px">
 <label for="newex">Nom<input id="newex" maxlength="60" placeholder="Ex. Presse inclinée Technogym"></label>
 <div class="g2"><label for="newm">Muscle principal<select id="newm">${Object.keys(MUS).map(m=>`<option value="${m}">${cap(m)}</option>`).join('')}</select></label>
 <label for="newm2">Secondaire<select id="newm2"><option value="">Aucun</option>${Object.keys(MUS).map(m=>`<option value="${m}">${cap(m)}</option>`).join('')}</select></label></div>
 <div class="g2"><label for="newk">Matériel<select id="newk">${Object.entries(KINDS).map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select></label>
 <label for="newc">Mouvement<select id="newc"><option value="1">Polyarticulaire</option><option value="0">Isolation</option></select></label></div>
 <div class="g2"><label for="newlt">Charge notée<select id="newlt">${Object.entries(LTL).map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select></label>
 <label for="newu">Compté en<select id="newu">${Object.entries(UL).map(([k,l])=>`<option value="${k}">${l[1]}</option>`).join('')}</select></label></div>
 <p id="newerr" class="sm redc" style="margin:0" role="alert" hidden>Donne un nom à l’exercice.</p>
 <button class="btn2 acb" data-a="createex">Créer et ajouter</button></div></details>`,'pick')}

/* ================= correct a set (any session, even old ones) ================= */
function editLogSheet(o){const l=o.lid?S.logs.find(x=>x.id===o.lid):null;if(o.lid&&!l)return;const id=l?l.e:o.e,u=l?unL(l):uOf(id),lt=l?ltL(l):ltOf(id),s=sessById(l?l.sid:o.sid);
 view.el=view.el&&view.el.key===(o.lid||o.sid+o.e)?view.el:{key:o.lid||o.sid+o.e,lid:o.lid,sid:o.sid,e:o.e,f:l?.f||'ok',w:!!l?.w,r:l?.r??lastOne(id)?.r??10,dr:l?.dr?structuredClone(l.dr):null,kg:l?.kg??lastOne(id)?.kg??0};
 const E=view.el,R=LIM.r[u];
 sheet(`<div class="grab"></div><div class="row sb"><div class="grow"><h2 id="sheet-title" tabindex="-1">${l?'Corriger la série':'Ajouter une série'}</h2><span class="sm mut">${esc(exo(id).n)}${s?', '+esc(sessName(s))+' du '+dShort(key(s.start)):''}</span></div>${closeBtn}</div>
 <div class="g2"><label for="ekg">${LTIN[lt]} (kg)<input id="ekg" type="text" inputmode="decimal" value="${String(E.kg).replace('.',',')}"></label>
 <label for="er">${UL[u][1]}<input id="er" type="text" inputmode="numeric" value="${E.r}"></label></div>
 ${E.w?'':`<div class="col g6"><span class="lbl" id="eflab">Ressenti</span><div class="feelh" role="group" aria-labelledby="eflab">${Object.entries(FEEL).map(([k,lb])=>`<button class="chip ${E.f===k?'on':''}" aria-pressed="${E.f===k}" style="font-size:14px;padding:4px 2px" data-a="efeel" data-v="${k}">${lb}<small>${FEELD[k]}</small></button>`).join('')}</div></div>`}
 <button class="sw" role="switch" aria-checked="${E.w}" data-a="ewarm"><span class="col" style="gap:0"><span class="b sm">Série d’échauffement</span><span class="xs mut">Hors objectif, volume et records</span></span><span class="knob" aria-hidden="true"></span></button>
 ${E.dr?`<div class="card sm row sb"><span>Dégressif : ${E.dr.map(d=>fmt(d.kg)+' × '+d.r).join(' → ')}</span><button class="link mutl" data-a="edropoff">Retirer</button></div>`:''}
 ${l&&(l.lt!==ltOf(id)||l.un!==uOf(id))?`<p class="xs mut" style="margin:0">Série notée en « ${LTL[lt]} », ${UL[u][1].toLowerCase()} : elle garde cette mesure.</p>`:''}
 <span class="xs mut">Les records, objectifs, XP et trophées sont recalculés après la correction.</span>
 <div class="sfoot"><p id="seterr" class="sm redc" style="margin:0" role="alert" hidden></p><div class="row">${l?`<button class="btn2 grow danger" style="min-height:54px" data-a="dellog" data-v="${l.id}">Supprimer</button>`:''}<button class="btn grow" data-a="savelog">Enregistrer</button></div></div>`,'elog')}
</script>

<script>
/* ================= charts ================= */
function lineChart(pts,label,fmtX,unit=''){if(!pts.length)return '';const vs=pts.map(p=>p[1]),mn=Math.min(...vs),mx=Math.max(...vs),pad=Math.max(1,(mx-mn)*.15),lo=Math.floor(mn-pad),hi=Math.ceil(mx+pad);
 const W=326,H=150,x=i=>pts.length===1?(W+34)/2:44+i*(W-58)/(pts.length-1),y=v=>130-(v-lo)/(hi-lo)*110;
 const P=pts.map((p,i)=>x(i)+','+y(p[1])).join(' ');
 return `<figure class="card" style="margin:0;padding:16px 12px 10px"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(label)} : de ${fmt(vs[0])} à ${fmt(vs.at(-1))}${unit}">
  ${[hi,(hi+lo)/2,lo].map(v=>`<line x1="38" y1="${y(v)}" x2="${W}" y2="${y(v)}" style="stroke:var(--rule2)" stroke-dasharray="3 5"/><text x="0" y="${y(v)+4}" style="fill:var(--ink2);font:600 11px var(--fw)">${fmt(v)}</text>`).join('')}
  ${pts.length>1?`<polygon points="${x(0)},130 ${P} ${x(pts.length-1)},130" style="fill:var(--hl2)"/><polyline points="${P}" fill="none" style="stroke:var(--ink)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`:''}
  ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p[1])}" r="${i===pts.length-1?6:3.5}" style="fill:${i===pts.length-1?'var(--hl)':'var(--card)'};stroke:var(--ink)" stroke-width="2"/>`).join('')}</svg>
  <figcaption class="row sb xs mut" style="padding-left:38px"><span>${fmtX(pts[0][0])}</span><span>${pts.length>1?fmtX(pts.at(-1)[0]):''}</span></figcaption></figure>`}

/* ================= Progrès ================= */
function monthStats(ym){const D=doneSess().filter(s=>key(s.start).startsWith(ym)),L=D.flatMap(s=>sWork(s.id));return {D,L,vol:vol(L),recs:new Set(L.filter(isRec).map(l=>l.sid+l.e)).size}}
function monthWeeks(Y,M){const first=new Date(Y,M-1,1),mon=new Date(first);mon.setDate(1-((first.getDay()+6)%7));const out=[];
 for(let d=new Date(mon);d<new Date(Y,M,1);d.setDate(d.getDate()+7)){const k=key(d);out.push({lab:dShort(k),n:weekN(k),goal:wkGoal(k),fut:k>today()})}return out}
function monthLifts(ym,st){return [...new Set(st.L.map(l=>l.e))].filter(id=>ltOf(id)==='load'&&uOf(id)==='reps').map(id=>{const before=workOf(id).filter(l=>key(l.t)<ym+'-01'&&ormOk(l)),inM=st.L.filter(l=>l.e===id&&ormOk(l));if(!inM.length)return null;
 const b0=before.length?Math.max(...before.map(l=>orm(l.kg,l.r))):Math.max(...inM.filter(l=>l.sid===inM[0].sid).map(l=>orm(l.kg,l.r)));
 const b1=Math.max(b0,...inM.map(l=>orm(l.kg,l.r)));return {id,b1,d:b1-b0}}).filter(Boolean).sort((a,b)=>b.d-a.d).slice(0,5)}
function Prog(){if(view.page==='ex')return Machine(view.ex);if(view.page==='day')return DayView(view.day);if(view.page==='sess')return SessView(view.sid);if(view.page==='lib')return Library();if(view.page==='records')return Records();
 const now=new Date(),ym=view.ym||today().slice(0,7),[Y,M]=ym.split('-').map(Number);
 const prevYm=key(new Date(Y,M-2,1)).slice(0,7),nextYm=key(new Date(Y,M,1)).slice(0,7),isCur=ym===today().slice(0,7);
 const st=monthStats(ym),pv=monthStats(prevYm),dom=+today().slice(8);
 const pvVol=isCur?vol(pv.L.filter(l=>+key(l.t).slice(8)<=dom)):pv.vol,dv=pvVol?Math.round((st.vol/pvVol-1)*100):null;
 const weeks=monthWeeks(Y,M),goal=S.prof.sess,mxw=Math.max(goal,...weeks.map(w=>w.n),1),target=Math.round(goal*new Date(Y,M,0).getDate()/7);
 const lifts=monthLifts(ym,st);
 const wkv={};IDX().L.filter(l=>!l.w&&Date.now()-l.t<7*864e5).forEach(l=>exo(l.e).m.forEach((m,i)=>wkv[m]=(wkv[m]||0)+(i?.5:1)));
 const vmax=25,volRows=Object.keys(MUS).map(m=>{const v=wkv[m]||0,cl=v>20?'hi':v>=10?'ok':'';
  return `<div class="vol"><span>${m}</span><div class="vtrack" role="img" aria-label="${m} : ${fmt(v)} séries sur 7 jours"><span class="zone" style="left:${10/vmax*100}%;width:${10/vmax*100}%"></span><i class="${cl}" style="width:${Math.min(100,v/vmax*100)}%"></i></div><span class="num" style="font-size:18px;text-align:right">${fmt(v)}</span></div>`}).join('');
 const a=active(),SS=[...(a?[a]:[]),...doneSess().slice().reverse()],hist=SS.slice(0,view.more?80:8).map(sessRow).join('');
 const used=S.ex.filter(e=>workOf(e.id).length).sort((x,y)=>workOf(y.id).at(-1).t-workOf(x.id).at(-1).t);
 const X=XP(),eq=equiv(X.vol),A=avgGain();
 return `<h1>Progrès</h1>
 <section class="hero" style="gap:6px"><span class="eyebrow">Total soulevé depuis le début</span><span class="num" style="font-size:58px"><span class="hl">${volTxt(X.vol)}</span></span><span class="sm mut">${eq?eq+', ':''}${pl(X.sessions,'séance')}, ${pl(X.prs,'record')}</span>
 ${A?`<div class="row" style="gap:12px;margin-top:8px;padding-top:12px;border-top:1px solid var(--rule)"><span class="num okc" style="font-size:40px">${pctTxt(A.pct)}</span><div class="col" style="gap:2px"><b>de 1RM estimé en moyenne</b><span class="xs mut">Écart entre ta 1re séance et ton meilleur 1RM estimé (Epley), sur ${pl(A.n,'exercice')} avec charge. La plus forte hausse : ${esc(A.top.e.n)} ${pctTxt(A.top.g.pct)}.</span></div></div>`:''}</section>
 <section class="col"><h2 class="lbl">Séances</h2>${hist||'<div class="empty">Tes séances apparaîtront ici après ta première série.</div>'}${!view.more&&SS.length>8?'<button class="btn2" data-a="more">Voir tout l’historique</button>':''}</section>
 <section class="card col"><div class="row sb"><span class="lbl">Assiduité sur 18 semaines</span><span class="sm b">${pl(streak(),'semaine')} d’affilée</span></div>${heatmap()}</section>
 ${levelCard()}
 <button class="card row" style="width:100%;text-align:left;gap:14px" data-a="page" data-v="records"><svg width="48" height="48" viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="25" style="fill:var(--card);stroke:var(--red);stroke-width:2.5"/><text x="28" y="34" text-anchor="middle" style="font:800 18px var(--fw);font-stretch:80%;fill:var(--red)">PR</text></svg><div class="grow"><div class="b">Mur des records</div><div class="sm mut">Records historiques et meilleures perfs récentes</div></div>${ic('chev',18)}</button>
 <section class="col"><div class="row sb"><button class="x s" data-a="ym" data-v="${prevYm}" aria-label="Mois précédent">${ic('left',16)}</button><h2 class="lbl">Bilan de ${MONTHS[M-1]} ${Y!==now.getFullYear()?Y:''}</h2><button class="x s" data-a="ym" data-v="${nextYm}" aria-label="Mois suivant" ${isCur?'disabled':''}>${ic('chev',16)}</button></div>
 <div class="tiles"><div class="tile"><span class="sm mut">Séances</span><span class="num">${st.D.length}<span class="mut" style="font-size:16px"> / ${target}</span></span></div>
 <div class="tile"><span class="sm mut">Volume</span><span class="num">${fmt(st.vol/1000)} t</span>${dv!=null?`<span class="xs ${dv>=0?'okc':'warnc'} b">${dv>0?'+':''}${dv} %</span><span class="xs mut">vs ${isCur?'même période':MONTHS[(M+10)%12]}</span>`:''}</div>
 <div class="tile"><span class="sm mut">Records</span><span class="num">${st.recs}</span></div></div>
 <div class="card col"><div class="row sb"><span class="sm mut">Séances par semaine</span><span class="xs mut">objectif ${goal}</span></div>
 <div class="wbars" style="grid-template-columns:repeat(${weeks.length},1fr)" role="img" aria-label="Séances par semaine : ${weeks.map(w=>w.n).join(', ')}"><div class="goal" style="bottom:${22+goal/mxw*88}px"></div>
 ${weeks.map(w=>`<div class="wb"><span class="num" style="font-size:16px;${w.fut?'opacity:.3':''}">${w.fut?'':w.n}</span><i class="${w.n>=w.goal?'ok':''}" style="height:${w.n/mxw*88}px"></i><span class="xs mut" style="white-space:nowrap">${w.lab}</span></div>`).join('')}</div></div>
 ${lifts.length?`<div class="card col g4"><span class="sm mut">1RM estimé (indicatif), évolution du mois</span>${lifts.map(l=>`<div class="kv"><span>${esc(exo(l.id).n)}</span><span><b>${fmt(Math.round(l.b1))} kg</b> <span class="${l.d>0?'okc':'mut'} b">${l.d>0?'+'+fmt(Math.round(l.d)):'±0'}</span></span></div>`).join('')}</div>`:''}
 ${sample&&st.L.length?`<div class="card col"><div class="row sb"><span class="lbl">Avis du coach</span>${view.coach?.busy?'<span class="spin" role="status" aria-label="Analyse en cours"></span>':''}</div>
  ${view.coach?.text?`<div class="coach">${esc(view.coach.text)}</div>`:`<span class="sm mut">Claude lit ton mois (séances, charges, ressentis, poids) et te donne 3 à 5 conseils concrets.</span>`}
  ${view.coach?.err?`<span class="sm warnc">${esc(view.coach.err)}</span>`:''}
  ${view.coach?.busy?'<button class="btn2" data-a="coachstop">Arrêter</button>':`<button class="btn2 acb" data-a="coach">${ic('spark',16)} ${view.coach?.text?'Relancer l’analyse':'Analyser mon mois'}</button>`}</div>`:''}
 ${st.L.length&&(dl||!window.claude)?`<button class="btn2" data-a="png" data-v="${ym}">${ic('camera',16)} Exporter le bilan en image</button>`:''}</section>
 <section class="col"><div class="row sb"><h2 class="lbl">Séries par muscle, 7 jours</h2><span class="xs mut">zone utile 10 à 20</span></div><div class="card col g4">${volRows}</div></section>
 <button class="card row" style="width:100%;text-align:left;gap:14px" data-a="page" data-v="lib">${thumb('elev')}<div class="grow"><div class="b">Bibliothèque d’exercices</div><div class="sm mut">${S.ex.length} exercices illustrés, avec les muscles et les bons gestes</div></div>${ic('chev',18)}</button>
 ${(()=>{const G=Object.keys(S.goalsEx||{}).map(id=>({id,g:goalInfo(id)})).filter(x=>x.g&&S.ex.some(e=>e.id===x.id));return G.length?`<section class="col"><h2 class="lbl">Tes objectifs</h2>${G.map(({id,g})=>`<button class="item" style="min-height:70px" data-a="exdetail" data-v="${id}">${thumb(id)}<div class="grow col" style="gap:6px"><div class="row sb"><b>${esc(exo(id).n)}</b><span class="num ${g.done?'okc':''}" style="font-size:20px">${fmt(g.kg)} kg</span></div><div class="xpbar" style="height:6px" aria-hidden="true"><i style="width:${Math.round(g.pct*100)}%;${g.done?'background:var(--ok)':''}"></i></div><span class="xs mut">${g.done?'Atteint le '+dShort(g.done)+', fixe la suite':Math.round(g.pct*100)+' %'+(g.eta?', vers le '+dShort(g.eta):'')}</span></div></button>`).join('')}</section>`:''})()}
 <section class="col"><h2 class="lbl">Tes exercices</h2>${used.map(exRow).join('')||'<div class="empty">Aucune série enregistrée pour l’instant.</div>'}</section>`}
function sessRow(s){const L=sWork(s.id),live=s.state==='active';
 return `<button class="item" style="min-height:64px${live?';border:2px solid var(--ink)':''}" data-a="sess" data-v="${s.id}"><div class="grow"><div class="b">${cap(new Date(s.start).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'}))}, ${hm(s.start)}, ${esc(sessName(s))}${live?' <span class="tag">en cours</span>':''}</div>
 <div class="sm mut">${pl(L.length,'série')}${sessMins(s)?', '+sessMins(s)+' min':''}${s.mood?', '+MOODS.find(m=>m[0]===s.mood)?.[1]:''}${s.note?', '+esc(s.note):''}</div></div><span class="num" style="font-size:20px">${volTxt(vol(L))}</span></button>`}
function exRow(e){const B=bestSet(e.id),L=workOf(e.id),g=gainOf(e.id),big=bigOf(e.id,B);
 return `<button class="item" style="min-height:64px" data-a="exdetail" data-v="${e.id}">${thumb(e.id)}<div class="grow"><div class="b">${esc(e.n)}</div><div class="sm mut">${g&&g.pct?`<b class="okc">${pctTxt(g.pct)}</b> ${esc(g.what)}, `:''}${pl(L.length,'série')}</div></div><div style="text-align:right"><span class="num" style="font-size:24px">${big.n}</span><span class="mut xs"> ${big.u}</span><div class="xs mut">record</div></div></button>`}
/* one session: every set can be corrected, deleted or added, even weeks later */
function SessView(sid){const s=sessById(sid);if(!s){view={};return Prog()}const L=sLogs(sid),by={};L.forEach(l=>(by[l.e]=by[l.e]||[]).push(l));const W=L.filter(l=>!l.w),live=s.state==='active';
 return `<div class="row">${back()}<span class="lbl">${cap(dLong(key(s.start)))}, ${hm(s.start)}</span></div>
 <h1 class="md">${esc(sessName(s))}</h1>
 ${live?`<div class="card hl row sb"><span class="sm">Séance en cours</span><button class="btn2 acb" data-a="tab" data-v="seance">Reprendre</button></div>`:''}
 <div class="tiles"><div class="tile"><span class="sm mut">Volume</span><span class="num">${volTxt(vol(W))}</span></div>
 <div class="tile"><span class="sm mut">Séries</span><span class="num">${W.length}</span></div><div class="tile"><span class="sm mut">Durée</span><span class="num">${sessMins(s)} min</span></div></div>
 ${!W.length&&!live?'<div class="card warn sm">Aucune série de travail : cette séance ne compte pas (ni XP, ni assiduité).</div>':''}
 ${Object.entries(by).map(([id,LL])=>`<section class="card" style="padding:6px 16px"><button class="row sb link" style="width:100%;font-size:15px;text-decoration:none" data-a="exdetail" data-v="${id}"><b>${esc(exo(id).n)}</b>${ic('chev',16)}</button>
  ${LL.map(l=>`<button class="hist" data-a="editlog" data-v="${l.id}" aria-label="Corriger ${esc(setTxt(l))}"><span class="grow">${l.w?'<span class="tag grey">éch.</span> ':''}${esc(setTxt(l))}${isRec(l)?' <span class="tag rec">record</span>':''}</span><span class="sm mut">${l.w?'':FEEL[l.f]?.toLowerCase()||''}</span>${ic('edit',16)}</button>`).join('')}
  <button class="link" data-a="addlog" data-v="${sid}|${id}">${ic('plus',14)} Ajouter une série</button></section>`).join('')}
 <button class="btn2" data-a="pickex" data-v="sess:${sid}">${ic('plus',16)} Ajouter un exercice à cette séance</button>

/* recovery is an approximation from your sets, your effort and an average recovery time per muscle */
function fatigue(offsetH=0){const now=Date.now()+offsetH*36e5,F={},by={};
 IDX().L.filter(l=>!l.w&&now-l.t<80*36e5&&l.t<=now).forEach(l=>{exo(l.e).m.forEach((m,i)=>{const kk=l.sid+'|'+m;by[kk]=by[kk]||{m,t:l.t,n:0,src:sessName(sessById(l.sid)||{})};by[kk].n+=(i?.5:1)*({easy:.7,ok:1,max:1.2,hard:1.3}[l.f]||1);by[kk].t=Math.max(by[kk].t,l.t)})});
 Object.values(by).forEach(s=>{if(!MUS[s.m])return;const I=Math.min(1,s.n*.15),h=(now-s.t)/36e5,f=I*Math.max(0,1-h/MUS[s.m]);if(f>(F[s.m]?.f||0))F[s.m]={f,I,h,src:s.src,t:s.t}});return F}

/* ---------- barcode scan: photo → native BarcodeDetector or ZXing → YOUR product base (not a universal food database) ---------- */
let zxP=null;
function loadZX(){if(window.ZXing)return Promise.resolve(window.ZXing);if(zxP)return zxP;
 const srcs=['https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js','https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js'];
 zxP=srcs.reduce((p,src)=>p.catch(()=>new Promise((ok,ko)=>{const s=document.createElement('script');s.crossOrigin='anonymous';s.src=src;s.onload=()=>window.ZXing?ok(window.ZXing):ko();s.onerror=()=>{s.remove();ko()};document.head.appendChild(s)})),Promise.reject()).catch(e=>{zxP=null;throw e});return zxP}
async function decodeBarcode(file){
 if('BarcodeDetector' in window){try{const bd=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']}),bm=await createImageBitmap(file),r=await bd.detect(bm);if(r[0])return r[0].rawValue}catch(e){}}
 const Z=await loadZX();const u=URL.createObjectURL(file);
 try{const im=await new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ko;i.src=u});
  const hints=new Map();hints.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.UPC_E]);hints.set(Z.DecodeHintType.TRY_HARDER,true);
  const rd=new Z.MultiFormatReader();rd.setHints(hints);
  for(const mx of [1400,900,2000]){const s=Math.min(1,mx/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
   for(const rot of [0,90]){try{let cv=c;if(rot){cv=document.createElement('canvas');cv.width=c.height;cv.height=c.width;const x=cv.getContext('2d');x.translate(cv.width/2,cv.height/2);x.rotate(Math.PI/2);x.drawImage(c,-c.width/2,-c.height/2)}
    const lum=new Z.HTMLCanvasElementLuminanceSource(cv),bmp=new Z.BinaryBitmap(new Z.HybridBinarizer(lum));return rd.decode(bmp).getText()}catch(e){}}}
  return null}finally{URL.revokeObjectURL(u)}}

 const nextB=(l='Continuer')=>`<div class="row" style="margin-top:auto">${s>0?`<button class="x" data-a="ob" data-v="${s-1}" aria-label="Retour">${ic('back',20)}</button>`:''}<button class="btn grow" data-a="ob" data-v="${s+1}">${l}</button></div>`;
 if(s===0)return `<div class="ob"><span class="b" style="font-size:20px;font-stretch:120%;letter-spacing:.5px">Charge</span>
  <div class="card col" style="gap:0;padding:0;overflow:hidden" aria-hidden="true">
   ${[['Développé couché','60 kg × 8',1],['','62,5 kg × 8',1],['','<span class="hl">62,5 kg × 8</span>',0]].map(([n,v,d],i)=>`<div class="srow ${d?'done':'now'}" style="grid-template-columns:34px 1fr 54px"><span class="n">${i+1}</span><span class="val" style="font-weight:800;font-stretch:80%;font-size:22px">${v}</span><span class="tick ${d?'on':''}">${ic('check',22)}</span></div>`).join('')}</div>
  <h1>Ton carnet<br>de fonte.</h1><p class="mut" style="margin:0;font-size:17px;max-width:34ch">Une ligne par série, une touche pour valider. L’appli retient tes charges et te dit quand monter.</p>
  <button class="btn" style="margin-top:auto" data-a="skipob">Commencer une séance</button>
  <button class="btn2" data-a="ob" data-v="1">Choisir mon programme et mon objectif</button>
  <p class="xs mut" style="margin:0;text-align:center">Tout reste sur ce téléphone. Rien à créer, aucun compte.</p></div>`;
 if(s===1)return `<div class="ob">${dots}<h1 class="md">Faisons connaissance</h1><p class="mut" style="margin:0">Ces infos servent seulement à estimer tes besoins caloriques.</p>
  <label for="ob_name">Prénom<input id="ob_name" data-c="pname2" maxlength="30" value="${esc(p.name)}" placeholder="Facultatif" autocomplete="given-name"></label>
  <div class="chips" style="grid-template-columns:1fr 1fr" role="group" aria-label="Sexe">${[['h','Homme'],['f','Femme']].map(([k,l])=>`<button class="chip ${p.sex===k?'on':''}" aria-pressed="${p.sex===k}" style="font-size:15px" data-a="sex" data-v="${k}">${l}</button>`).join('')}</div>
  <div class="g3"><label for="ob_a">Âge<input id="ob_a" data-c="prof" data-k="a" type="number" inputmode="numeric" min="14" max="99" value="${p.a}"></label><label for="ob_h">Taille (cm)<input id="ob_h" data-c="prof" data-k="h" type="number" inputmode="numeric" min="120" max="230" value="${p.h}"></label><label for="ob_w">Poids (kg)<input id="ob_w" data-c="obw" type="number" inputmode="decimal" min="25" max="350" step="0.1" value="${fmt(wNow()).replace(',','.')}"></label></div>
  <p id="proferr" class="sm redc" role="alert" style="margin:0" hidden></p>${nextB()}</div>`;
 if(s===2){const g=goals();return `<div class="ob">${dots}<h1 class="md">Ton objectif</h1>
  <div class="col">${[['masse','Prendre du muscle','+300 kcal au-dessus de tes besoins'],['maintien','Garder mon poids','Recomposition, performance'],['seche','Sécher','−400 kcal, protéines hautes']].map(([k,l,d])=>`<button class="item ${p.goal===k?'on':''}" style="min-height:64px" aria-pressed="${p.goal===k}" data-a="goal" data-v="${k}"><div class="grow"><div class="t">${l}</div><div class="sm mut">${d}</div></div>${p.goal===k?ic('check'):''}</button>`).join('')}</div>
  <div class="col"><span class="lbl">Activité en dehors de la salle</span><div class="chips" role="group" aria-label="Activité" style="grid-template-columns:repeat(2,1fr)">${Object.entries(ACT).map(([k,[l]])=>`<button class="chip ${p.act===k?'on':''}" aria-pressed="${p.act===k}" style="font-size:15px" data-a="act" data-v="${k}">${l}</button>`).join('')}</div></div>
  <div class="col"><span class="lbl">Séances par semaine</span><div class="chips" role="group" aria-label="Séances par semaine" style="grid-template-columns:repeat(5,1fr)">${[2,3,4,5,6].map(n=>`<button class="chip ${p.sess==n?'on':''}" aria-pressed="${p.sess==n}" data-a="wsess" data-v="${n}">${n}</button>`).join('')}</div></div>
  <div class="card row sb"><span class="mut">Estimation de départ</span><span><b class="num" style="font-size:28px">${nf(g.k)}</b> kcal, ${g.p} g prot.</span></div>${nextB()}</div>`}
 const rec=p.sex==='f'?(p.sess<=3?'gf':'gl'):p.sess<=3?'fb':p.sess===4?'hb':'ppl',ch=view.obt||(S.logs.length?'keep':rec);
 return `<div class="ob">${dots}<h1 class="md">Ton programme</h1><p class="mut" style="margin:0">Tout se modifie ensuite : exercices, séries, fourchettes de répétitions, repos.</p>
  <div class="col">${S.logs.length?`<button class="item ${ch==='keep'?'on':''}" style="min-height:64px" aria-pressed="${ch==='keep'}" data-a="obt" data-v="keep"><div class="grow"><div class="t">Garder mon programme</div><div class="sm mut">${esc(S.pn)} : ${S.progs.map(x=>esc(x.n)).join(', ')}</div></div>${ch==='keep'?ic('check'):''}</button>`:''}
  ${Object.entries(TPL).map(([k,t])=>`<button class="item ${ch===k?'on':''}" style="min-height:64px" aria-pressed="${ch===k}" data-a="obt" data-v="${k}"><div class="grow"><div class="t">${t.n} ${k===rec?'<span class="tag">Conseillé</span>':''}</div><div class="sm mut">${t.lvl}, ${t.info}</div></div>${ch===k?ic('check'):''}</button>`).join('')}</div>
  <div class="row" style="margin-top:auto"><button class="x" data-a="ob" data-v="2" aria-label="Retour">${ic('back',20)}</button><button class="btn grow" data-a="obdone">C’est parti</button></div></div>`}

/* ================= coach (Claude) ================= */
let coachCtl=null;
async function runCoach(){const ym=view.ym||today().slice(0,7),st=monthStats(ym);coachCtl=new AbortController();view.coach={busy:1};render();
 const days=st.D.map(s=>{const by={};sWork(s.id).forEach(l=>(by[exo(l.e).n]=by[exo(l.e).n]||[]).push(setTxt(l).replace(/ kg × /,'x')+(l.f==='hard'?'!':l.f==='easy'?'+':'')));
  return `${key(s.start)} ${hm(s.start)} ${sessName(s)}${s.mood?' humeur:'+s.mood:''}${s.note?' note:"'+s.note.slice(0,80)+'"':''}\n`+Object.entries(by).map(([n,a])=>'  '+n+': '+a.join(' ')).join('\n')}).join('\n');
 const tr=trend(),g=goals(),nut=[...Array(7)].map((_,i)=>nutDay(addDays(today(),-i))).filter(n=>n.k>0);
 const prompt=`Tu es un coach de musculation francophone, direct et précis. Voici le mois de ${MONTHS[+ym.slice(5)-1]} d’un pratiquant (${S.prof.sex==='f'?'femme':'homme'}, ${S.prof.a} ans, ${fmt(wNow())} kg, objectif ${S.prof.goal}, ${S.prof.sess} séances/semaine prévues, programme « ${S.pn} »).
Séances (charge kg x reps ; + = facile, ! = échec ; PDC = poids du corps) :
${days.slice(0,9000)}
Tendance du poids : ${tr==null?'inconnue':fmt2(tr)+' kg/semaine'}. Objectif calorique ${g.k} kcal, protéines ${g.p} g. Moyenne 7 derniers jours saisis : ${nut.length?Math.round(nut.reduce((s,n)=>s+n.k,0)/nut.length)+' kcal, '+Math.round(nut.reduce((s,n)=>s+n.p,0)/nut.length)+' g prot.':'non renseignée'}.
Donne 3 à 5 conseils concrets et chiffrés, en t’appuyant sur les données (régularité, progression des charges, stagnations, équilibre des muscles, récupération, nutrition). Une ligne par conseil, qui commence par « – ». Pas de titre, pas de markdown, pas de formule de politesse. Si les données sont trop maigres, dis-le en une ligne et donne quand même 2 conseils.`;
 try{const r=await sample(prompt,{signal:coachCtl.signal,cache:false,onText:({text})=>{view.coach={busy:1,text};if(tab==='prog'&&!view.page&&!$('#ov').innerHTML)render()}});view.coach={text:r.text}}
 catch(e){view.coach={text:e?.text||'',err:e?.code==='cancelled'?'':({not_granted:'Accès à Claude refusé pour cette page.',rate_limited:'Trop de demandes pour le moment, réessaie plus tard.'}[e?.code]||'L’analyse a échoué. Réessaie.')}}
 coachCtl=null;if(tab==='prog')render()}
</script>

<script>
/* ================= overlay helpers: focus moves into the dialog, the page behind is inert, focus returns on close ================= */
let curSheet=null,opener=null;
function setInert(on){['#app','#nav','#pill'].forEach(s=>{const e=$(s);if(!e)return;e.inert=on;if(on)e.setAttribute('aria-hidden','true');else e.removeAttribute('aria-hidden')})}
function sheet(h,k){const ov=$('#ov'),old=ov.querySelector('.sheet>div'),same=old&&curSheet===k,top=same?old.scrollTop:0;
 const fe=document.activeElement,fk=same&&fe&&ov.contains(fe)?{id:fe.id,a:fe.dataset?.a,v:fe.dataset?.v}:null;
 if(!ov.innerHTML)opener=document.activeElement;
 curSheet=k;ov.innerHTML=`<div class="sheet${same?' re':''}" data-k="${k}"><div role="dialog" aria-modal="true" aria-labelledby="sheet-title">${h}</div></div>`;setInert(true);
 const box=ov.querySelector('.sheet>div');if(top)box.scrollTop=top;
 if(fk){const t=fk.id?document.getElementById(fk.id):[...box.querySelectorAll('[data-a]')].find(e=>e.dataset.a===fk.a&&(e.dataset.v??'')===(fk.v??''));if(t){t.focus({preventScroll:true});return}}
 if(!same)(box.querySelector('#sheet-title')||box.querySelector('button,input'))?.focus({preventScroll:true})}
function openLayer(h,k){const ov=$('#ov');if(!ov.innerHTML)opener=document.activeElement;curSheet=k;ov.innerHTML=h;setInert(true);(ov.querySelector('[id$="-title"]')||ov.querySelector('button'))?.focus({preventScroll:true})}
function close(){clearInterval(timer);$('#ov').innerHTML='';curSheet=null;view.st=null;view.delprog=0;view.mood=null;view.note=null;view.rec=null;view.qq=null;view.el=null;
 if(view.rest){view.rest=null;persistRest()}setInert(false);
 /* the screen behind is redrawn: give focus back to the same control (same id, or same action + value) */
 const k=opener&&opener!==document.body?{id:opener.id,a:opener.dataset?.a,v:opener.dataset?.v}:null;opener=null;render();
 if(k){const t=(k.id&&document.getElementById(k.id))||[...document.querySelectorAll('#app [data-a],#nav [data-a]')].find(e=>e.dataset.a===k.a&&(e.dataset.v??'')===(k.v??''));if(t)t.focus({preventScroll:true})}}
const closeOv=()=>{clearInterval(timer);$('#ov').innerHTML='';curSheet=null;setInert(false)};
const stOf=()=>view.st;
function syncKg(){const st=view.st,i=$('#kgin');if(st&&i){const n=parseNum(i.value);if(isFinite(n))st.kg=n}}
function clampKg(id,v){const K=LIM.kg[ltOf(id)];return Math.min(K[1],Math.max(K[0],Math.round(v*100)/100))}
function clampR(id,v){const R=LIM.r[uOf(id)];return Math.min(R[1],Math.max(R[0],Math.round(v)))}
async function saveFile(fn,data,type){if(dl){try{await dl.save({filename:fn,data});return true}catch(e){if(e?.code!=='declined')toast('Export impossible ici');return false}}
 const blob=data instanceof Blob?data:new Blob([data],{type}),u=URL.createObjectURL(blob),l=document.createElement('a');l.href=u;l.download=fn;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);return true}
/* replacing all data (import, backup, reset): everything that disappears is marked deleted, so the account copy cannot bring it back */
function replaceAll(N){const now=Date.now(),del={...(S.del||{})};
 /* every record of the new copy gets a version above the one it replaces, and everything that disappears is deleted at its version */
 const tv=(o,old)=>{o.ver=Math.max(o.ver||0,old?.ver||0,(del[o._k]&&typeof del[o._k]==='object'?del[o._k].v:0))+1;o.u=now};
 for(const [c,f] of Object.entries(COLL)){const old=new Map((S[c]||[]).map(x=>[f(x),x])),keep=new Set((N[c]||[]).map(f));old.forEach((x,k)=>{if(!keep.has(k))del[c+':'+k]={t:now,v:x.ver||0}});(N[c]||[]).forEach(x=>{const k=f(x);x._k=c+':'+k;tv(x,old.get(k));delete x._k;delete del[c+':'+k]})}
 for(const m of MAPS){const O=S[m]||{};Object.keys(O).forEach(k=>{if(!(N[m]||{})[k])del[m+':'+k]={t:now,v:O[k]?.ver||0}});Object.entries(N[m]||{}).forEach(([k,x])=>{if(x&&typeof x==='object'){x._k=m+':'+k;tv(x,O[k]);delete x._k;delete del[m+':'+k]}})}
 N.del=del;N.mt={};META.forEach(f=>N.mt[f]=now);S=N;REV++}

/* ================= actions ================= */
const A={
 tab:v=>{if(v==='seance'&&tab==='seance'&&view.page){view={};return render()}go(v)},
 page:v=>{view={page:v};render();scrollTo(0,0)},
 back:()=>{if(view.page==='ex'&&view.from&&view.from!=='prog'){if(view.from==='lib'){view={page:'lib',lm:view.lm,lq:view.lq};render();scrollTo(0,0);return}if(view.from==='sess'&&view.fsid){view={page:'sess',sid:view.fsid};render();return}return go(view.from)}
  if(view.page==='sess'&&view.fday){view={page:'day',day:view.fday};render();return}
  const keep=tab==='prog'?{ym:view.ym}:tab==='corps'?{ct:view.ct}:{};view=keep;render();scrollTo(0,0)},
 gotoprogs:()=>go('seance',{page:'progs'}),gopoids:()=>go('corps',{ct:'poids'}),gocorps:()=>{close();go('corps',{ct:'recup'})},
 day:v=>go('prog',{page:'day',day:v}),
 sess:v=>{const fday=view.page==='day'?view.day:null;closeOv();go('prog',{page:'sess',sid:v,fday})},
 /* séance */
 startsess:()=>{const s=ensureSession();save();render();const P=s.plan,n=P.find(p=>curWork(p.id).length<p.s)?.id||P[0]?.id;if(n)setSheet(n)},
 cancelsess:()=>{const a=active();if(!a)return close();if(sWork(a.id).length){close();return toast('Cette séance contient des séries : valide-la, ou supprime-la depuis Progrès.')}
  delSession(a.id);save();close();toast('Séance annulée')},
 set:v=>{if(!v)return;view.st=null;setSheet(v)},
 /* one line of the logbook: read the two fields of the line and validate */
 tick:v=>{const [id,k]=v.split('|'),fk=document.querySelector(`[data-row="${CSS.escape(id+'|'+k+'|kg')}"]`),fr=document.querySelector(`[data-row="${CSS.escape(id+'|'+k+'|r')}"]`);
  const val=checkSet(id,fk?.value??'',fr?.value??'',null);if(!val){(fk&&!inR(ltOf(id)!=='load'&&fk.value===''?0:parseNum(fk.value),LIM.kg[ltOf(id)])?fk:fr)?.setAttribute('aria-invalid','true');return}
  const T=view.rows?.[id];if(T)T.splice(+k,1);logSet(id,val.kg,val.r,'ok',null,false)},
 tickmore:v=>{view.st=null;setSheet(v)},
 rfeel:v=>{const R=view.rest,l=R&&S.logs.find(x=>x.id===R.lid);if(!l)return;l.f=v;stamp(l,'logs',l.id);save();buildRest()},
 keepgoing:()=>{view.keep=active()?.id;render()},
 closeother:v=>{const o=sessById(v);if(!o)return;closeSession(o);save();evalBadges(true);render();toast('Séance « '+esc(sessName(o))+' » validée')},
 dropother:v=>{const o=sessById(v);if(!o||sWork(o.id).length)return;delSession(o.id);save();render();toast('Séance vide supprimée')},
 useother:v=>{setPref(v);view.keep=null;render();scrollTo(0,0)},
 rawdl:async()=>{if(BAD&&await saveFile('charge-donnees-brutes-'+today()+'.txt',BAD.raw,'text/plain'))toast('Fichier brut téléchargé')},
 badreset:v=>{if(v==='ask'){view.badreset=1;return render()}if(v==='no'){view.badreset=0;return render()}
  BAD=null;S=SEED();view={};tab='seance';persistLocal();REV++;render();toast('Appli remise à zéro')},
 kg:v=>{const st=stOf();if(!st)return;syncKg();st.kg=clampKg(st.id,st.kg+ +v*incOf(st.id));setSheet(st.id)},
 reps:v=>{const st=stOf();if(!st)return;syncKg();st.r=clampR(st.id,+v);setSheet(st.id)},
 feel:v=>{const st=stOf();syncKg();st.f=v;setSheet(st.id)},
 warmtog:()=>{const st=stOf();syncKg();st.w=!st.w;if(st.w)st.dr=null;setSheet(st.id)},
 again:()=>{const id=stOf().id,tg=target(id);if(!tg)return;closeOv();logSet(id,tg.kg,tg.r,'ok')},
 validate:()=>{const st=stOf();if(!st)return;const v=readSet(st.id,'#kgin',st.r);if(!v)return;st.kg=v.kg;
  if(st.dr&&st.dr.some(d=>!inR(d.kg,LIM.kg.load)||!inR(d.r,[1,100]))){const e=$('#seterr');e.hidden=false;e.textContent='Palier dégressif invalide.';return}
  closeOv();logSet(st.id,v.kg,v.r,st.f,st.dr,st.w)},
 warm:v=>{const st=stOf();const [kg,r]=v.split(':').map(Number);logSet(st.id,kg,r,null,null,true)},
 dellog:v=>{const l=delLog(v);if(!l)return;const gone=reconcileBadges();save();
  if(curSheet==='set')setSheet(l.e);else if(curSheet==='elog')close();else render();
  toast('Série supprimée'+(gone.length?' · trophée retiré : '+esc(gone[0].n):''),['restorelog','Annuler',JSON.stringify(l)])},
 restorelog:v=>{try{const l=JSON.parse(v);if(!sessById(l.sid))return toast('Séance supprimée entre-temps : restauration impossible');delete S.del?.['logs:'+l.id];addLog(l);evalBadges(true);save();render();if(curSheet==='set')setSheet(l.e);toast('Série restaurée')}catch(e){}},
 editlog:v=>{view.el=null;editLogSheet({lid:v})},
 addlog:v=>{const [sid,e]=v.split('|');view.el=null;editLogSheet({sid,e})},
 efeel:v=>{const E=view.el;E.kg=parseNum($('#ekg').value);E.r=parseNum($('#er').value);E.f=v;editLogSheet(E.lid?{lid:E.lid}:{sid:E.sid,e:E.e})},
 ewarm:()=>{const E=view.el;E.kg=parseNum($('#ekg').value);E.r=parseNum($('#er').value);E.w=!E.w;if(E.w)E.dr=null;editLogSheet(E.lid?{lid:E.lid}:{sid:E.sid,e:E.e})},
 edropoff:()=>{const E=view.el;E.kg=parseNum($('#ekg').value);E.r=parseNum($('#er').value);E.dr=null;editLogSheet(E.lid?{lid:E.lid}:{sid:E.sid,e:E.e})},
 savelog:()=>{const E=view.el,l=E.lid?S.logs.find(x=>x.id===E.lid):null,id=l?l.e:E.e,v=readSet(id,'#ekg',parseNum($('#er').value));if(!v)return;
  if(l){l.kg=v.kg;l.r=v.r;if(E.w){l.w=1;delete l.f;delete l.dr}else{delete l.w;l.f=E.f;if(E.dr)l.dr=E.dr;else delete l.dr}stamp(l)}
  else{const s=sessById(E.sid);if(!s)return close();const L=sLogs(s.id),t=Math.max(s.start,L.at(-1)?.t||s.start)+6e4;
   if(!s.plan.some(p=>p.id===id)){s.plan.push({id,s:1,rmin:v.r,rmax:v.r,n:exo(id).n,extra:1})}if(s.end&&t>s.end)s.end=t;stamp(s);
   addLog({sid:s.id,e:id,kg:v.kg,r:v.r,t,...(E.w?{w:1}:{f:E.f})})}
  save();const gone=reconcileBadges();evalBadges(true);save();close();toast((l?'Série corrigée':'Série ajoutée')+' · stats recalculées'+(gone.length?' · trophée retiré : '+esc(gone[0].n):''))},
 undo:v=>{const l=delLog(v);if(!l)return;const gone=reconcileBadges();if(view.rest?.lid===v){view.rest=null;persistRest()}view.rec=null;save();closeOv();render();
  toast('Série annulée'+(gone.length?', trophée retiré':''));focusRow(l.e)},
 swap:v=>{const id=stOf().id,a=ensureSession(),i=a.plan.findIndex(x=>x.id===id);if(i<0)return;const it=a.plan[i];a.plan[i]={...it,id:v,orig:it.orig||it.id,n:exo(v).n};stamp(a);save();view.st=null;render();setSheet(v);toast('Remplacé pour cette séance seulement')},
 unswap:v=>{const a=active();if(!a)return;const i=a.plan.findIndex(x=>x.orig===v);if(i<0)return;const it={...a.plan[i],id:v,n:exo(v).n};delete it.orig;a.plan[i]=it;stamp(a);save();view.st=null;render();setSheet(v)},
 rmextra:v=>{const a=active();if(!a)return;a.plan=a.plan.filter(x=>x.id!==v||!x.extra);stamp(a);save();close()},
 exdetail:v=>{const from=tab==='prog'?(view.page==='lib'?'lib':view.page==='sess'?'sess':'prog'):tab,lm=view.lm,lq=view.lq,fsid=view.sid;if($('#ov').innerHTML){closeOv();view.st=null}go('prog',{page:'ex',ex:v,from,lm,lq,fsid})},
 demopause:()=>{view.demoPause=!view.demoPause;render()},
 togdemo:()=>{const st=stOf();syncKg();view.showDemo=!view.showDemo;setSheet(st.id)},
 lm:v=>{view.lm=v;render()},
 addto:v=>addToSheet(v),
 addtoprog:v=>{const id=view.addto,p=S.progs.find(x=>x.id===v);if(!p||!id)return;const c=exo(id).c;p.items.push({id,s:3,rmin:c?8:10,rmax:c?10:15});stamp(p);save();close();toast(esc(exo(id).n)+' ajouté à '+esc(p.n))},

/* ================= events ================= */
document.addEventListener('click',ev=>{
 const sh=ev.target.classList?.contains('sheet')?ev.target:null;if(sh)return close();
 const b=ev.target.closest('[data-a]');if(!b||b.disabled)return;const f=A[b.dataset.a];if(f){ev.preventDefault();f(b.dataset.v??'',b,ev)}});
document.addEventListener('change',ev=>{const t=ev.target,d=t.dataset,c=d.c;
 if(t.id==='importfile'){const f=t.files[0];t.value='';if(!f)return;f.text().then(x=>{let o;try{o=JSON.parse(x)}catch(e){throw ['fichier JSON illisible']}view.imp=prepareImport(o);render()})
  .catch(er=>{view.imp=null;render();toast('Import refusé, tes données sont intactes : '+esc((Array.isArray(er)?er:['fichier invalide']).slice(0,2).join(' · ')))});return}
 if(t.id==='photofile'){const f=t.files[0];t.value='';if(!f)return;shrink(f).then(blob=>PH.put({id:uid(),d:today(),t:Date.now(),blob})).then(loadPhotos).then(()=>{render();toast('Photo ajoutée · pense à la sauvegarder à part')}).catch(()=>toast('Impossible d’enregistrer cette photo'));return}
 if(t.id==='scanfile'){const f=t.files[0];t.value='';if(!f)return;scanSheet({busy:'Lecture du code-barres…'});
  decodeBarcode(f).then(code=>{if(code)return afterCode(code);scanSheet({err:'Pas de code-barres trouvé sur la photo. Rapproche-toi, cadre-le bien à plat et net, ou saisis les chiffres.'})})
  .catch(()=>scanSheet({err:'Le lecteur de code-barres n’a pas pu se charger (réseau nécessaire la première fois). Saisis les chiffres du code.'}));return}
